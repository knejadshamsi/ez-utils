[package]
name = "ez-utils"
version = "0.1.0"
description = "A visual editor for transportation simulation files"
authors = ["knejadshamsi"]
edition = "2021"

[lib]
name = "ez_utils_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
quick-xml = "0.39.2"
proj4rs = "0.1.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
rand = "0.9"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
