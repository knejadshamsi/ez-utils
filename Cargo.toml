[package]
name = "ez-utils"
version = "0.1.2"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ez-utils"
path = "src/main.rs"

[dependencies]
indicatif = "0.17.7"
geo = { version = "0.29", features = ["use-serde"] }
geo-types = "0.7"
dotenv = "0.15"
tabled = "0.17"
quick-xml = "0.30"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
rayon = "1.8"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "postgres", "json"] }
tokio = { version = "1.35", features = ["full"] }
regex = "1.10"
chrono = "0.4"
thiserror = "2.0"
serde_json = "1.0"
csv = "1.3"
toml = "0.8"
dirs = "6.0"
proj4rs = "0.1.5"
rand = "0.8"
console = "0.15"
crossterm = "0.27"
