[package]
name = "ez-utils"
version = "0.1.0"
edition = "2021"

[dependencies]
quick-xml = "0.31"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.4", features = ["derive"] }
indicatif = "0.17"
anyhow = "1.0"
geo = "0.27"
rayon = "1.8"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "json"] }
tokio = { version = "1.35", features = ["full"] }
proj = "0.27"
